set-environment -gF TMUX_CONFIG_DIR '#{HOME}/.config/tmux'

# Set prefix
unbind C-b
set -g prefix C-t
run "tmux bind -r #{prefix} send-prefix"

# Use vi mode-keys
set -g mode-keys vi

# Enable Mouse
set -g mouse on

# True color support
set -g default-terminal "tmux-256color"
set -sa terminal-overrides ',xterm-256color:RGB'

# Options for Neovim
set -sg escape-time 0
set -g focus-events on
# Options for neovim image.nvim plugin
set -gq allow-passthrough on
set -g visual-activity off

# different size windows for different clients of same session
# setw -g aggressive-resize on

# Shell
set -g default-command "${SHELL}"

# 1-indexed Windows and Panes
set -g base-index 1
setw -g pane-base-index 1

# Dynamic Window names
# rename window to reflect current program
setw -g automatic-rename on
# renumber windows when a window is closed
set -g renumber-windows on

# Increase scrollback buffer size
set -g history-limit 1000000

# When the current session exits: If there are other detached sessions, then
# switch to the most recently used one. If not, then close the client.
set-option -g detach-on-destroy no-detached

#=== Bindings ==================================================================

# Re-source tmux configuration
bind-key s source-file -F "#{TMUX_CONFIG_DIR}/tmux.conf" \; \
  display-message "#{TMUX_CONFIG_DIR}/tmux.conf sourced" \; refresh-client

# Kill Session, Server
bind X confirm-before kill-server

# Kill window (confirm if more than 1 pane or current command is not the $SHELL)
bind-key -r & if-shell \
  '[ "#{window_panes}" = "1" ] && \
   [ "#{pane_current_command}" = "$(basename #{default-shell})" ]' \
  'kill-window' \
  'confirm-before -p "kill-window #I (id: #{window_id}, number of panes: #{window_panes}, \
focused pane command: #{pane_current_command})? (y/n)" kill-window'

# Kill pane (confirm if current command is not the $SHELL)
bind-key -r x if-shell \
  '[ "#{pane_current_command}" = "$(basename #{default-shell})" ]' \
  'kill-pane' \
  'confirm-before -p "kill-pane #P (id: #{pane_id}, \
command: #{pane_current_command})? (y/n)" kill-pane'


# Reset pane
bind C-r \
  confirm-before -p "Reset tmux pane at path '#{pane_current_path}' \
  and running the command '#{pane_current_command}'? [y/n]:" \
  "run-shell \"tmux run 'tmux respawn-pane -t #{pane_id} -k \
  -c #{pane_current_path}'\""

# create session
bind C-c new-session

# Find session
#bind C-f command-prompt -p find-session 'switch-client -t %%'

# Choose Tree
bind C-s choose-tree

# Split current window
bind -r '"' split-window -v -c '#{pane_current_path}'
bind -r "%" split-window -h -c '#{pane_current_path}'

bind -r c new-window -c '#{pane_current_path}'

# Window movement
bind-key -r H swap-window -t -1\; select-window -t -1
bind-key -r L swap-window -t +1\; select-window -t +1

# Pane movement
bind-key + choose-tree "join-pane -s '%%'"
bind-key * break-pane

# Pane navigation
bind -r h select-pane -L       # move left
bind -r j select-pane -D       # move down
bind -r k select-pane -U       # move up
bind -r l select-pane -R       # move right
bind > swap-pane -D            # swap current pane with the next one
bind < swap-pane -U            # swap current pane with the previous one

# Pane resizing
bind -r C-h resize-pane -L 2
bind -r C-j resize-pane -D 2
bind -r C-k resize-pane -U 2
bind -r C-l resize-pane -R 2

# Copy mode bindings ───────────────────────────────────────────────────────────

# Mouse drag selection: Copy to clipboard (uses OSC52) without clearing selection
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-no-clear
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear

# Jump between shell prompts (requires shell to output OSC 133 markers)
bind -T copy-mode-vi [ send-keys -X previous-prompt
bind -T copy-mode-vi ] send-keys -X next-prompt

#=== Plugins ===================================================================
# Plugin: TPM
# Bootstrap Tmux Plugin Manager
set-environment -gF TMUX_PLUGIN_MANAGER_PATH \
  '#{HOME}/.local/share/tmux/plugins/'
if 'test ! -d "${TMUX_PLUGIN_MANAGER_PATH}/tpm"' {
  run -b '${TMUX_CONFIG_DIR}/bootstrap-tpm.sh'
} {
#───────────────────────────────────────────────────────────────────────────────
# Start of (unindented) conditional section: if TPM-already-setup-up
# If TPM is not yet downloaded, then the below section will skipped for now. The
# bootstrap code (called above) will re-source this file after setting TPM up.
#───────────────────────────────────────────────────────────────────────────────
# TPM can manage itself once it is set up.
set -g @plugin 'tmux-plugins/tpm'
set -g @tpm-source-async on
set -g @tpm-source-await-at-end off
#───────────────────────────────────────────────────────────────────────────────
# Plugin: tmux-window-name {
# Smart window rename
# Note: Should come before tmux-resurrect
# Requires: python-libtmux
set -g @plugin 'ofirgall/tmux-window-name'

set -g @tmux_window_name_max_name_len "15"
set -g @tmux_window_name_use_tilde "True"
set -g @tmux_window_name_show_program_args "False"
set -g @tmux_window_name_icon_style "'name_and_icon'"
# https://www.nerdfonts.com/cheat-sheet
set -g @tmux_window_name_custom_icons '{"cmake": "","nvim": "", "yazi": ""}'
#}──────────────────────────────────────────────────────────────────────────────
# Plugin: tmux-resurrect {
# Save and reload the tmux session: panes, windows, layout, (some) programs.
set -g @plugin 'tmux-plugins/tmux-resurrect'

set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'
#}──────────────────────────────────────────────────────────────────────────────
# Plugin: tmux-yank {
# Copy text to clipboard
set -g @plugin 'tmux-plugins/tmux-yank'

# Normal mode: <prefix>y => Copy command buffer
# Copy mode:   y         => Copy selected text

set -g @yank_action 'copy-pipe-no-clear'
#}──────────────────────────────────────────────────────────────────────────────
# Plugin: tmux-logging {
# Save / log pane buffer
set -g @plugin 'tmux-plugins/tmux-logging'

# <prefix><S-p>   => Start/stop logging to file.
# <prefix><M-p>   => Save pane's visible output to file.
# <prefix><M-S-p> => Save complete pane buffer to file.

set -g @logging-path "$HOME/tmux-logging"
set -g @screen-capture-path "$HOME/tmux-logging"
set -g @save-complete-history-path "$HOME/tmux-logging"
#}──────────────────────────────────────────────────────────────────────────────
# Plugin: tmux-fingers {
# Insert / copy various predefined patterns from pane
set -g @plugin 'Morantron/tmux-fingers'

set -g @fingers-key 'Space'
#}──────────────────────────────────────────────────────────────────────────────
# Plugin: extrakto {
# Fuzzy search and insert / copy text from current tmux window
set -g @plugin 'laktak/extrakto'

set -g @extrakto_key 'Tab'
set -g @extrakto_split_direction 'a' # ([a]uto, [p]opup, [v]ertical, [h]orizontal)
#}──────────────────────────────────────────────────────────────────────────────
# Plugin: tmux-power-zoom {
# Temporarily view current pane as a separate full window.
set -g @plugin 'jaclu/tmux-power-zoom'

set -g @power_zoom_trigger "Z"
#}──────────────────────────────────────────────────────────────────────────────
# Plugin: tmux-suspend {
# Suspend tmux prefix key temporarily (useful for nested tmux in ssh)
set -g @plugin 'MunifTanjim/tmux-suspend'

set -g @suspend_key 'F12'
#}──────────────────────────────────────────────────────────────────────────────
# Plugin: Theme: catppuccin {

set -g @plugin 'catppuccin/tmux'

# Required additional plugins
# These plugins edit the tmux status, so they should be source sequentially.
set -g @tpm-source-async off
set -g @plugin 'dreknix/tmux-primary-ip'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @tpm-source-async on

run '#{TMUX_PLUGIN_MANAGER_PATH}/tmux/catppuccin.tmux'

# Tmux status settings
set-option -g status-position top
set -g 'status-format[1]' ''
set -g status 2
set -g status-left-length 100
set -g status-right-length 100

set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_status_background "none"

# Transparent status bg fix
# https://github.com/catppuccin/tmux/issues/409#issuecomment-2894937794
set -g @catppuccin_window_status_style "custom"
set -g @catppuccin_window_left_separator \
  "#[bg=default,fg=#{@thm_surface_0}]#[bg=#{@thm_surface_0},fg=#{@thm_fg}]"
set -g @catppuccin_window_right_separator \
  "#[bg=default,fg=#{@thm_surface_0}]"
set -g @catppuccin_window_current_left_separator \
  "#[bg=default,fg=#{@thm_mauve}]#[bg=#{@thm_mauve},fg=#{@thm_bg}]"
set -g @catppuccin_window_current_middle_separator "#[fg=#{@thm_mauve}]█"
set -g @catppuccin_window_current_right_separator \
  "#[bg=default,fg=#{@thm_surface_1}]"

set -g @catppuccin_window_number "#I:"
set -g @catppuccin_window_current_number "#I"
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text " #W"

# Set status-right icon bg/fg colors to be the same as that of text
# catppuccin.tmux needs to be re-run after setting battery fg/bg:
set -gF @catppuccin_status_battery_icon_bg "#{@thm_surface_0}"
set -gF @catppuccin_status_battery_icon_fg "#{@thm_fg}"
run '#{TMUX_PLUGIN_MANAGER_PATH}/tmux/catppuccin.tmux'
set -gF @catppuccin_status_uptime_icon_fg "#{@thm_fg}"
set -gF @catppuccin_status_uptime_icon_bg "#{@thm_surface_0}"
set -gF @catppuccin_status_date_time_icon_fg "#{@thm_fg}"
set -gF @catppuccin_status_date_time_icon_bg "#{@thm_surface_0}"
set -gF @catppuccin_status_primary_ip_icon_fg "#{@thm_fg}"
set -gF @catppuccin_status_primary_ip_icon_bg "#{@thm_surface_0}"

source -F '#{TMUX_CONFIG_DIR}/plugin-files/catppuccin/modules/primary_ip.conf'

set -g @catppuccin_date_time_text ' %d.%m.%Y %H:%M'

set -g status-left ""
set -g status-right ""

set -agF status-right "#{E:@catppuccin_status_primary_ip}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set -ag  status-right "#{E:@catppuccin_status_uptime}"
set -ag  status-right "#{E:@catppuccin_status_date_time}"

#}

# Initialize TMUX plugin manager
run '#{TMUX_PLUGIN_MANAGER_PATH}/tpm/tpm'

# Post-plugin-load options

set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_connect_separator "no"
source -F '#{TMUX_PLUGIN_MANAGER_PATH}/tmux/status/session.conf'
set -ag  status-left "#{E:@catppuccin_status_session}  "

#───────────────────────────────────────────────────────────────────────────────
} # End of conditional section: if TPM-already-setup-up
#───────────────────────────────────────────────────────────────────────────────

# Source local config file
if-shell '[ -e #{TMUX_CONFIG_DIR}/local.conf ]' {
	source-file -F "#{TMUX_CONFIG_DIR}/local.conf"
}
