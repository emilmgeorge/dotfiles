set-environment -gF TMUX_CONFIG_DIR '#{HOME}/.config/tmux'

# Set prefix
unbind C-b
set -g prefix C-t
run "tmux bind #{prefix} send-prefix"

# Use vi mode-keys
set -g mode-keys vi

# Enable Mouse
set -g mouse on

# True color support
set -g default-terminal "tmux-256color"
set -sa terminal-overrides ',xterm-256color:RGB'

# Options for Neovim
set -sg escape-time 0
set -g focus-events on
# Options for neovim image.nvim plugin
set -gq allow-passthrough on
set -g visual-activity off

# Do not exit copy mode on mouse release (Does not work in 16.04 tmux version)
unbind -T copy-mode MouseDragEnd1Pane
unbind -T copy-mode-vi MouseDragEnd1Pane

# different size windows for different clients of same session
# setw -g aggressive-resize on

# Shell
set -g default-command "${SHELL}"

# 1-indexed Windows and Panes
set -g base-index 1
setw -g pane-base-index 1

# Dynamic Window names
# rename window to reflect current program
setw -g automatic-rename on
# renumber windows when a window is closed
set -g renumber-windows on

# Increase scrollback buffer size
set -g history-limit 1000000

### Plugins --------------------------------------------------------------------------------------

# Configure Tmux Plugin Manager
set-environment -gF TMUX_PLUGIN_MANAGER_PATH '#{HOME}/.local/share/tmux/plugins/'
if 'test ! -d "${TMUX_PLUGIN_MANAGER_PATH}/tpm"' {
  run 'mkdir -p "${TMUX_PLUGIN_MANAGER_PATH}"'
  run 'git clone https://github.com/tmux-plugins/tpm "${TMUX_PLUGIN_MANAGER_PATH}/tpm"'
  run '${TMUX_PLUGIN_MANAGER_PATH}/tpm/bin/install_plugins'
}

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'Morantron/tmux-fingers'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'jaclu/tmux-power-zoom'
set -g @plugin 'MunifTanjim/tmux-suspend'
set -g @plugin 'emilmgeorge/tmux-power'

## Theme config ----------------------------------------------------------------------------------

set -g @tmux_power_show_web_reachable false
set -g @tmux_power_show_upload_speed false
set -g @tmux_power_show_download_speed false


### Bindings -------------------------------------------------------------------------------------

# Tmux resurrect
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

# Tmux logging options
set -g @logging-path "$HOME/tmux_logs"
set -g @screen-capture-path "$HOME/tmux_logs"
set -g @save-complete-history-path "$HOME/tmux_logs"

# Tmux fingers options
set -g @fingers-key 'Space'

# Tmux suspend options
set -g @suspend_key 'F12'
set -g @suspend_on_suspend_command "" #Run any arbitrary command
set -g @suspend_on_resume_command ""

# Extrakto options
set -g @extrakto_key 'Tab'
set -g @extrakto_split_direction 'a' # ([a]uto, [p]opup, [v]ertical, [h]orizontal)

# Tmux powerzoom options
set -g @power_zoom_trigger "Z"
set -g @power_zoom_mouse 1

# Re-source tmux configuration
bind-key s source-file -F "#{TMUX_CONFIG_DIR}/tmux.conf" \; display-message "#{TMUX_CONFIG_DIR}/tmux.conf sourced" \; refresh-client

# Kill Session, Server
bind X confirm-before kill-server

# Reset pane
bind C-r \
	confirm-before -p "Reset tmux pane at path '#{pane_current_path}' \
	and running the command '#{pane_current_command}'? [y/n]:" \
	"run-shell \"tmux run 'tmux respawn-pane -t #{pane_id} -k -c #{pane_current_path}'\""

# create session
bind C-c new-session

# Find session
#bind C-f command-prompt -p find-session 'switch-client -t %%'

# Choose Tree
bind C-s choose-tree

# Split current window
bind -r '"' split-window -v -c '#{pane_current_path}'
bind -r "%" split-window -h -c '#{pane_current_path}'

bind -r c new-window -c '#{pane_current_path}'

# Window movement
bind-key -r H swap-window -t -1\; select-window -t -1
bind-key -r L swap-window -t +1\; select-window -t +1

# Pane movement
bind-key + choose-tree "join-pane -s '%%'"
bind-key * break-pane

# Pane navigation
bind -r h select-pane -L       # move left
bind -r j select-pane -D       # move down
bind -r k select-pane -U       # move up
bind -r l select-pane -R       # move right
bind > swap-pane -D            # swap current pane with the next one
bind < swap-pane -U            # swap current pane with the previous one

# Pane resizing
bind -r C-h resize-pane -L 2
bind -r C-j resize-pane -D 2
bind -r C-k resize-pane -U 2
bind -r C-l resize-pane -R 2

# Source local config file
if-shell '[ -e #{TMUX_CONFIG_DIR}/local/main.conf ]' {
	source-file -F "#{TMUX_CONFIG_DIR}/local/main.conf"
}

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '#{TMUX_PLUGIN_MANAGER_PATH}/tpm/tpm'
